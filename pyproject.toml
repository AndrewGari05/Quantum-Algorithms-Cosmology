[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "qablate"
dynamic = ["version"]
description = "Classical-quantum ablation studies for Bayesian parameter inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrés García Rivera", email = "andres.garciarivera05@gmail.com" }]
requires-python = ">=3.10"
keywords = ["bayesian inference", "mcmc", "variational inference", "quantum computing",
            "qiskit", "ablation", "cosmology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
quantum = ["qiskit>=2.0", "qiskit-aer>=0.17"]
ibm = ["qiskit-ibm-runtime>=0.40"]
diagnostics = ["arviz>=0.18"]
plot = ["matplotlib>=3.7", "corner>=2.2"]
all = ["qablate[quantum,ibm,diagnostics,plot]", "tqdm>=4.60"]
dev = ["qablate[all]", "pytest>=8", "ruff>=0.6", "emcee>=3.1"]

[project.urls]
Repository = "https://github.com/AndrewGari05/Quantum-Algorithms-Cosmology"

[tool.hatch.version]
path = "src/qablate/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qablate"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules -m 'not slow'"
markers = ["slow: long statistical tests (select with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
